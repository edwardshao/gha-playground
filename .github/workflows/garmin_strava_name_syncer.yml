name: Sync Garmin activity name to Strava
on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * *'  # UCT+8 03:00
jobs:
  sync_activity:
    strategy:
      matrix:
        user: [edward, joey]
        include:
          - user: edward
            garmin_token_name: GARMIN_TOKENS_BASE64
            strava_cookie_name: EDWARD_STRAVA_COOKIE
            run_cmd_args: --sync-ignore-file ./syncginore.txt
          - user: joey
            garmin_token_name: JOEY_GARMIN_TOKENS_BASE64
            strava_cookie_name: JOEY_STRAVA_COOKIE
            run_cmd_args: ""

    runs-on: ubuntu-latest
    defaults:
        run:
            working-directory: garmin_strava_name_syncer
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version-file: 'garmin_strava_name_syncer/pyproject.toml'
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          working-directory: garmin_strava_name_syncer
          enable-cache: 'auto'
      - name: Install dependencies and setup environment
        run: |
          uv sync --locked
      - name: Start mitmproxy
        env:
          PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
        run: |
          ./mitmproxy_ctl.sh start
      - name: Run name syncer
        env:
          GARMIN_TOKENS_BASE64: ${{ secrets[matrix.garmin_token_name] }}
          STRAVA_COOKIE: ${{ secrets[matrix.strava_cookie_name] }}
          HTTP_PROXY: http://localhost:8080
          HTTPS_PROXY: http://localhost:8080
          REQUESTS_CA_BUNDLE: mitmproxy-ca-cert.pem
          SSL_CERT_FILE: mitmproxy-ca-cert.pem
        run: |
          cp ~/.mitmproxy/mitmproxy-ca-cert.pem .
          echo "Syncing '${{matrix.user}}' activity to Strava"
          uv run name_syncer.py ${{matrix.run_cmd_args}}
      - name: Update STRAVA_COOKIE in GitHub Secrets
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.SECRET_ACCESS_TOKEN }}
        run: |
          if [ -f ".strava_updated_cookie" ]; then
            gh secret set ${{matrix.strava_cookie_name}} --repo "${{ github.repository }}" < .strava_updated_cookie
            rm -f .strava_updated_cookie
            echo "✅ Successfully refreshed and updated STRAVA_COOKIE secret!"
          else
            echo "ℹ️ No updated cookie file found, skipping secret update."
          fi
      - name: Stop mitmproxy
        if: always()
        run: |
          ./mitmproxy_ctl.sh stop
      - name: Show mitmproxy logs
        if: always()
        run: |
          cat mitmproxy.log